name: Build Manager (armv7)

# Trimmed pipeline: builds only the 32-bit ARM (armeabi-v7a) manager APK.
# No LKM, ksuinit, host tools, riscv64/x86_64/arm64 or Telegram upload.
#
# Signing: add these repository secrets to keep the SAME signature on every build
#   KEYSTORE           base64 of your .jks   (base64 -w0 key.jks)
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
# Without them a one-off key is generated per run (the APK still builds, but its
# signature changes every time). The cert size/hash is printed in the job summary.

on:
  push:
  workflow_dispatch:
  workflow_call:

jobs:
  build-ksud:
    uses: ./.github/workflows/ksud.yml
    with:
      target: armv7-linux-androideabi

  build-manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Left unsigned here on purpose; the repack job signs the final APK.
      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager-gradle
          path: manager/app/build/outputs/apk/release/*.apk

  repack-manager:
    needs: [build-manager, build-ksud]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Download gradle manager artifact
        uses: actions/download-artifact@v8
        with:
          name: manager-gradle
          path: artifacts/manager-gradle

      - name: Download armv7 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-armv7-linux-androideabi
          path: artifacts/ksud-armv7-linux-androideabi

      - name: Place manager apk and ksud artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/release
          APK=$(find artifacts/manager-gradle -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp -f "$APK" manager/app/build/outputs/apk/release/

          mkdir -p target/armv7-linux-androideabi/release
          KSUD=$(find artifacts/ksud-armv7-linux-androideabi -type f -name ksud | head -n 1)
          test -n "$KSUD"
          cp -f "$KSUD" target/armv7-linux-androideabi/release/ksud

      - name: Prepare signing key
        env:
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$PROD_KEYSTORE" ]; then
            echo "$PROD_KEYSTORE" | base64 -d > key.jks
            ALIAS="$PROD_KEY_ALIAS"
            STORE_PASS="$PROD_KEYSTORE_PASSWORD"
            KEY_PASS="$PROD_KEY_PASSWORD"
          else
            echo "::warning::No KEYSTORE secret set - using a one-off key, signature will differ every run."
            ALIAS=ci-key
            STORE_PASS=$(openssl rand -hex 24)
            KEY_PASS="$STORE_PASS"
            echo "::add-mask::$STORE_PASS"
            keytool -genkeypair \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=KernelSU armv7 build" \
              -storetype JKS \
              -keystore key.jks
          fi

          {
            echo "SIGN_KEYSTORE_FILE=key.jks"
            echo "SIGN_KEY_ALIAS=$ALIAS"
            echo "SIGN_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "SIGN_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

          # Certificate size + SHA-256, same format the kernel side expects.
          keytool -exportcert -alias "$ALIAS" -keystore key.jks \
            -storepass "$STORE_PASS" -file cert.der
          SIZE_HEX=$(printf '0x%04x' "$(stat -c%s cert.der)")
          HASH=$(sha256sum cert.der | awk '{print $1}')
          {
            echo "### Manager signing certificate"
            echo "- size: \`$SIZE_HEX\`"
            echo "- sha256: \`$HASH\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Repack and resign
        run: |
          python3 repack_apk.py repack \
            -b release \
            -t release \
            -a armeabi-v7a \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD" \
            --strip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: manager-armv7
          path: dist/*.apk
